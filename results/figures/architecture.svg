<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" font-family="sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="ah" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#4b5563"/></marker></defs>
<text x="450.0" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">CertDistill: certified robustness for heterogeneous federated learning</text>
<rect x="30" y="70" width="150" height="110" rx="10" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
<text x="105.0" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">Client pool</text>
<text x="105.0" y="114" text-anchor="middle" font-size="11" fill="#374151">60 clients</text>
<text x="105.0" y="131" text-anchor="middle" font-size="11" fill="#374151">3 architectures</text>
<text x="105.0" y="148" text-anchor="middle" font-size="11" fill="#374151">CNN-S · CNN-D · MLP</text>
<rect x="240" y="70" width="150" height="110" rx="10" fill="#fef3c7" stroke="#1f2937" stroke-width="1.5"/>
<text x="315.0" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">K=20 subsets</text>
<text x="315.0" y="114" text-anchor="middle" font-size="11" fill="#374151">disjoint triples</text>
<text x="315.0" y="131" text-anchor="middle" font-size="11" fill="#374151">1 arch each</text>
<text x="315.0" y="148" text-anchor="middle" font-size="11" fill="#374151">stratified</text>
<rect x="450" y="70" width="170" height="110" rx="10" fill="#e0e7ff" stroke="#1f2937" stroke-width="1.5"/>
<text x="535.0" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">Local training</text>
<text x="535.0" y="114" text-anchor="middle" font-size="11" fill="#374151">E=3 epochs</text>
<text x="535.0" y="131" text-anchor="middle" font-size="11" fill="#374151">own architecture</text>
<text x="535.0" y="148" text-anchor="middle" font-size="11" fill="#374151">Byzantines may</text>
<text x="535.0" y="165" text-anchor="middle" font-size="11" fill="#374151">poison data</text>
<rect x="680" y="70" width="190" height="110" rx="10" fill="#fce7f3" stroke="#1f2937" stroke-width="1.5"/>
<text x="775.0" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">Robust distillation</text>
<text x="775.0" y="114" text-anchor="middle" font-size="11" fill="#374151">logits on probe set</text>
<text x="775.0" y="131" text-anchor="middle" font-size="11" fill="#374151">α-trimmed mean</text>
<text x="775.0" y="148" text-anchor="middle" font-size="11" fill="#374151">per (sample, class)</text>
<rect x="240" y="230" width="150" height="110" rx="10" fill="#d1fae5" stroke="#1f2937" stroke-width="1.5"/>
<text x="315.0" y="254" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">K students</text>
<text x="315.0" y="274" text-anchor="middle" font-size="11" fill="#374151">distilled</text>
<text x="315.0" y="291" text-anchor="middle" font-size="11" fill="#374151">fixed arch</text>
<text x="315.0" y="308" text-anchor="middle" font-size="11" fill="#374151">warm-started</text>
<rect x="450" y="230" width="170" height="110" rx="10" fill="#ede9fe" stroke="#1f2937" stroke-width="1.5"/>
<text x="535.0" y="254" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">Majority vote</text>
<text x="535.0" y="274" text-anchor="middle" font-size="11" fill="#374151">n_a vs n_b</text>
<text x="535.0" y="291" text-anchor="middle" font-size="11" fill="#374151">margin = n_a − n_b</text>
<rect x="680" y="230" width="190" height="110" rx="10" fill="#ffedd5" stroke="#1f2937" stroke-width="1.5"/>
<text x="775.0" y="254" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">Certificate</text>
<text x="775.0" y="274" text-anchor="middle" font-size="11" fill="#374151">margin > 2t  ⇒</text>
<text x="775.0" y="291" text-anchor="middle" font-size="11" fill="#374151">provably robust</text>
<text x="775.0" y="308" text-anchor="middle" font-size="11" fill="#374151">t ≤ B (tightened)</text>
<line x1="180" y1="125" x2="240" y2="125" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
<line x1="390" y1="125" x2="450" y2="125" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
<line x1="620" y1="125" x2="680" y2="125" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
<line x1="755" y1="180" x2="755" y2="230" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
<line x1="315" y1="180" x2="315" y2="230" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
<line x1="390" y1="285" x2="450" y2="285" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
<line x1="620" y1="285" x2="680" y2="285" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
<text x="90" y="365" font-size="12" fill="#374151">Lemma 1: below-capacity Byzantines can perturb, not control, distilled targets.</text>
<text x="90" y="385" font-size="12" fill="#374151">Theorem: vote margin &gt; 2t certifies the prediction — architecture-agnostic, tighter than Cao when t &lt; B.</text>
</svg>